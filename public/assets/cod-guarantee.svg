<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075E54" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="350" rx="16" fill="url(#cardGrad)" />

  <!-- Delivery Van Icon -->
  <g transform="translate(50, 60)">
    <rect x="0" y="20" width="130" height="80" rx="8" fill="#FFFFFF" />
    <path d="M130 50 L170 50 L190 75 L190 100 L130 100 Z" fill="#25D366" />
    <!-- Window -->
    <polygon points="135,55 165,55 180,75 135,75" fill="#075E54" />
    <!-- Wheels -->
    <circle cx="45" cy="100" r="18" fill="#333" />
    <circle cx="45" cy="100" r="7" fill="#FFF" />
    <circle cx="160" cy="100" r="18" fill="#333" />
    <circle cx="160" cy="100" r="7" fill="#FFF" />
    <!-- Speed Lines -->
    <line x1="-30" y1="40" x2="-5" y2="40" stroke="#25D366" stroke-width="4" stroke-linecap="round" />
    <line x1="-40" y1="60" x2="-10" y2="60" stroke="#25D366" stroke-width="4" stroke-linecap="round" />
    <line x1="-25" y1="80" x2="-8" y2="80" stroke="#25D366" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Big Badge -->
  <g transform="translate(320, 60)">
    <rect width="230" height="60" rx="30" fill="#25D366" />
    <text x="115" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      100% VERIFIED COD
    </text>
  </g>

  <!-- Text Details -->
  <text x="300" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    CASH ON DELIVERY GUARANTEE
  </text>
  <text x="300" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#D5F5E3" text-anchor="middle">
    Pay ONLY when the rider arrives at your doorstep!
  </text>

  <!-- 3 Trust Points -->
  <g transform="translate(60, 245)">
    <circle cx="20" cy="20" r="18" fill="#25D366" />
    <text x="20" y="26" font-size="18" text-anchor="middle" fill="#FFF">✓</text>
    <text x="50" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Inspect Parcel First</text>
  </g>
  <g transform="translate(240, 245)">
    <circle cx="20" cy="20" r="18" fill="#25D366" />
    <text x="20" y="26" font-size="18" text-anchor="middle" fill="#FFF">✓</text>
    <text x="50" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Zero Advance Payment</text>
  </g>
  <g transform="translate(440, 245)">
    <circle cx="20" cy="20" r="18" fill="#25D366" />
    <text x="20" y="26" font-size="18" text-anchor="middle" fill="#FFF">✓</text>
    <text x="50" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">24-48h Delivery</text>
  </g>
</svg>
